# Template for ~/.dsh/settings.yaml (or $DSH_HOME/settings.yaml).
#
# Copy it there — dsh reads its own home, not this repo:
#   mkdir -p ~/.dsh && cp harnesses/dsh/settings.yaml ~/.dsh/settings.yaml
#
# VERIFY ON FIRST RUN. This is written from dsh's documentation, not from a
# running install. dsh is at 0.1.x release candidates and its schema moves.

# customSkillDirs is NOT a top-level settings.yaml key, despite an earlier
# version of this file claiming otherwise — dsh only accepts it inside a
# `@deepseek-ai/dsh-skill-filesystem` row in a preset's own agent.cordis.yml.
# This repo's skill layers are wired that way instead, in the `agentic` preset
# at harnesses/dsh/presets/agentic/. See harnesses/dsh/README.md#presets.

# Make `agentic` (harnesses/dsh/presets/agentic/) the session default, once
# installed under $DSH_HOME/.agent-presets/agentic/ — see
# harnesses/dsh/README.md#presets. Layers a per-user default over the
# deployment's own; clearing this key re-inherits that default.
agent-presets:
  default: agentic

# Providers. The key is NEVER written here — apiKeyEnv names an environment
# variable, which providers/openrouter.env already exports.
llm-pi-ai:
  providers:
    openrouter:
      apiKeyEnv: OPENROUTER_API_KEY
      api: openai-completions          # openai-completions | openai-responses | anthropic-messages
      baseURL: https://openrouter.ai/api/v1
      models:
        - id: deepseek/deepseek-v4-pro
        - id: deepseek/deepseek-v4
        - id: anthropic/claude-opus-5
        - id: qwen/qwen3-coder

    # Direct DeepSeek, for when you want first-party rather than a router.
    # Uses providers/deepseek.env instead.
    deepseek:
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com
      models:
        - id: deepseek-v4-pro
        - id: deepseek-v4
