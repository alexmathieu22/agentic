<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<link rel="stylesheet" href="/style.css">
<script>
  // Set the theme before first paint so dark mode never flashes light while data loads.
  try { document.documentElement.dataset.theme = localStorage.getItem('hub-theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
</script>
</head>
<body>
<nav class="top">
  <b class="logo">hub<span>.</span></b>
  <div class="ctx" id="ctx"></div>
  <div class="pages" id="pages"></div>
  <button class="k" data-palette>⌘K search</button>
  <button class="k" id="theme" title="Toggle light/dark"></button>
</nav>
<main id="page" aria-busy="true"></main>
<div id="pal" hidden>
  <div class="box">
    <input id="q" autocomplete="off" placeholder="Search sessions, tickets, pages…   ↑↓ ↵   esc to close">
    <div id="res"></div>
  </div>
</div>
<script src="/app.js" type="module"></script>
</body>
</html>
